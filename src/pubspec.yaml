name: rent_manager
description: BizTown Rent-Manager - ung dung mobile quan ly nha cho thue
publish_to: "none"
version: 0.1.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  supabase_flutter: ^2.5.0
  go_router: ^14.2.0
  google_fonts: ^6.2.0
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  uuid: ^4.4.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  material_symbols_icons: ^4.2960.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Dùng trực tiếp trong core/supabase_client.dart để bọc lớp HTTP của Supabase
  # (tự thử lại khi gặp lỗi lệch đồng hồ PGRST303) — khai báo tường minh vì đã
  # import thẳng, không dựa vào việc supabase_flutter kéo theo.
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/icons/
    - assets/lang/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Splash hệ thống (native, hiện trước khi Flutter kịp vẽ frame đầu tiên) — khớp màu
# nền navy với S-00 (core/theme.dart AppColors.primary) để không bị "nhảy màu" khi
# chuyển từ splash hệ thống sang SplashScreen thật (Dart) của app.
flutter_native_splash:
  color: "#23305E"
  image: assets/icon/app_icon.png
  android_12:
    color: "#23305E"
    image: assets/icon/app_icon.png
  android: true
  ios: true
